services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "3000:3000"
    environment:
      NUXT_API_INTERNAL_BASE: http://backend:8000
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      additional_contexts:
        laravel: ../desafio-vercan-backend
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/laravel-data/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - ../desafio-vercan-backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_database:/var/lib/laravel-data

volumes:
  frontend_node_modules:
  frontend_nuxt:
  backend_vendor:
  backend_database:
